name: Release builds

# Builds the installer + portable app for Windows, Linux and macOS.
# Runs on version tags (v*) and can be re-run manually for an existing tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win nsis portable
          - os: ubuntu-latest
            target: --linux
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build UI
        working-directory: app
        run: npm run build:ui

      - name: Package
        working-directory: app
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifacts to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          for f in app/dist/*.exe app/dist/*.AppImage app/dist/*.deb app/dist/*.dmg app/dist/*.zip app/dist/*.blockmap; do
            if [ -e "$f" ]; then
              echo "uploading $f"
              gh release upload "$TAG" "$f" --clobber
            fi
          done

      - name: Upload workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heyvoices-${{ matrix.os }}
          path: |
            app/dist/*.exe
            app/dist/*.AppImage
            app/dist/*.deb
            app/dist/*.dmg
            app/dist/*.zip
          if-no-files-found: ignore
          retention-days: 14
